include:
  - ${SHARED_COMPOSE:-https://github.com/DEFRA/digital-waste-tracking-uat.git#main:shared-compose/compose.yml}

services:
  digital-waste-tracking-admin-ui:
    # A local name, so the build doesn't clash with a published image
    image: digital-waste-tracking-admin-ui:local
    build:
      context: .
      target: development
    ports:
      - '3000:3000'
      - '9229:9229'
    command: npm run dev:debug
    depends_on:
      - waste-organisation-backend
      - dwt-client-sync
      - floci
      - floci-az
    environment:
      PORT: 3000
      # Made-up local-only login: username "local", password "local"
      USER_BASIC_AUTH_LOCAL: bG9jYWw9bG9jYWw=
      WASTE_ORGANISATION_SERVICE_URL: http://waste-organisation-backend:3001
      DWT_CLIENT_SYNC_SERVICE_URL: http://dwt-client-sync:3001
      # Made-up, and accepted by the shared stack's organisation backend and client sync
      SERVICE_AUTH_PASSWORD: local-admin-ui
      # File change events don't reach containers through Docker Desktop or Colima
      # mounts, so Vite has to poll to reload styles and scripts
      CHOKIDAR_USEPOLLING: 'true'

      AUTH_MODE: entra
      ENTRA_ID_CLIENT_ID: ${ENTRA_ID_CLIENT_ID:-00000000-0000-0000-0000-000000000001}
      # localhost:4577 is forwarded to floci-az by the localhost-4577 sidecar, so the
      # browser and the container see the same issuer and authorize URLs
      ENTRA_ID_OIDC_DISCOVERY_URI: ${ENTRA_ID_OIDC_DISCOVERY_URI:-https://localhost:4577/00000000-0000-0000-0000-000000000002/v2.0/.well-known/openid-configuration}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      OIDC_LOGIN_CALLBACK_URI: '/auth'
      OIDC_RESPONSE_MODE: ${OIDC_RESPONSE_MODE:-query}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-local-secret}
      OIDC_COOKIE_IS_SECURE: ${OIDC_COOKIE_IS_SECURE:-false}
      OIDC_COOKIE_IS_SAME_SITE: ${OIDC_COOKIE_IS_SAME_SITE:-Lax}
      FEDERATED_CREDENTIALS_ENABLE_MOCKING: ${FEDERATED_CREDENTIALS_ENABLE_MOCKING:-true}
      FEDERATED_CREDENTIALS_AUDIENCE: ${FEDERATED_CREDENTIALS_AUDIENCE:-digital-waste-tracking-admin-ui}
      # floci-az uses a self-signed cert in local development
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
    volumes:
      # Run your working copy, reloading as you edit
      - ./src:/home/node/src
      - ./package.json:/home/node/package.json
    networks:
      - cdp-tenant

  # Forwards localhost:4577 inside the admin UI container to floci-az
  floci-localhost-4577-forwarder:
    image: alpine/socat
    network_mode: 'service:digital-waste-tracking-admin-ui'
    command: TCP-LISTEN:4577,fork,reuseaddr TCP:floci-az:4577
    depends_on:
      - digital-waste-tracking-admin-ui
      - floci-az

  # Local stand-ins for AWS and Entra ID
  floci:
    # 2.4.0+ supports STS GetWebIdentityToken
    image: floci/floci:2.4.0-compat
    ports:
      - '4599:4566'
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
    networks:
      - cdp-tenant

  floci-az:
    image: floci/floci-az:latest
    ports:
      - '4577:4577'
    environment:
      # MSAL talks to an HTTPS authority
      FLOCI_AZ_TLS_ENABLED: 'true'
    networks:
      - cdp-tenant
