# The admin UI with the services it calls - waste-organisation-backend for the
# Reporting page and dwt-client-sync for the Software providers page - from the
# shared compose stack in digital-waste-tracking-uat (see shared-compose/README.md
# there).
#
# docker compose up --build -d digital-waste-tracking-admin-ui
#     The admin UI and the services it needs, with the admin UI built from your
#     checkout and reloading as you edit. (Without the service name, it starts
#     the whole shared stack.)
# npm run dev:deps && npm run dev
#     Just the backends, with the admin UI run locally (see .env.example)
#
# Set SHARED_COMPOSE to a local checkout's shared-compose/compose.yml to try
# changes to the shared stack.

include:
  - ${SHARED_COMPOSE:-https://github.com/DEFRA/digital-waste-tracking-uat.git#main:shared-compose/compose.yml}

services:
  digital-waste-tracking-admin-ui:
    # A local name, so the build doesn't clash with a published image
    image: digital-waste-tracking-admin-ui:local
    build:
      context: .
      target: development
    ports:
      - '3000:3000'
    depends_on:
      - waste-organisation-backend
      - dwt-client-sync
    environment:
      PORT: 3000
      # Made-up local-only login: username "local", password "local"
      USER_BASIC_AUTH_LOCAL: bG9jYWw9bG9jYWw=
      WASTE_ORGANISATION_SERVICE_URL: http://waste-organisation-backend:3001
      DWT_CLIENT_SYNC_SERVICE_URL: http://dwt-client-sync:3001
      # Made-up, and accepted by the shared stack's organisation backend and client sync
      SERVICE_AUTH_PASSWORD: local-admin-ui
      # File change events don't reach containers through Docker Desktop or Colima
      # mounts, so Vite has to poll to reload styles and scripts
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      # Run your working copy, reloading as you edit
      - ./src:/home/node/src
      - ./package.json:/home/node/package.json
    networks:
      - cdp-tenant
